# ═══════════════════════════════════════════════════════════════
# BOLT Reference Attention Training Config
# ═══════════════════════════════════════════════════════════════
# 冻结 DiT，只训练 BoltReferenceAttentionLayers
# 数据: 预计算 VAE latent (.pt)
# Loss: Flow Matching MSE
# ═══════════════════════════════════════════════════════════════

output_dir: /root/autodl-tmp/Selector_VLM/bolt_ref_attn_run_5_4_cut025_merge085
seed: 42


# ── 数据 ──
data_config:
  feature_folders:
     - "/root/autodl-tmp/Selector_VLM/example_long/latents_short/latents_short_train"
    # - "/root/autodl-tmp/Selector_VLM/example_long/latents_short"
    # 可选择的目录:
    # - "/root/autodl-fs/HeliosBench-Weights/demo_data/ultravideo-long"


# ── 模型路径 ──
model_config:
  transformer_path: "/root/autodl-fs/BestWishYSH/Helios-Base"
  clip_model_path: "/root/autodl-fs/clip-vit-large-patch14/AI-ModelScope/clip-vit-large-patch14"


# ── BOLT Ref-Attn 参数 ──
bolt_config:
  # DiT 层范围 (闭区间)
  # 放在最后几层 (33-39)，这样 hook 之后只有 0-3 层需要保留激活
  # 大幅减少反向图的激活显存
  active_layers: "33-39"
  attn_dim: 1280       # bottleneck 维度 (5120→1280, 大幅省显存)
  num_heads: 10
  # ITS 选帧 (减少 k 以降低 ref_patches token 数, 省显存)
  k_select: 1
  # 最小时间距离阈值（单位：chunk），默认跳过 target 前 1、2 段
  min_chunk_distance: 3
  alpha: 0.3       # visual/text score 融合权重
  power: 1.5          # ITS 锐度系数 (降低以增加选帧多样性，升高以提升采样紧凑率)


# ── 训练选帧：VLM / CLIP+ITS（与 train_helios_bolt 的 argparse 同名，写入 config.json）──
# bolt_config 里的 k_select/alpha/power/min_chunk_distance 仍同时作用于：
#   - selector_type=clip_its：CLIP+ITS 选帧
#   - selector_type=vlm：未单独写 vlm_k_select/vlm_power/… 时，作为 VLM 的默认 k / power / min_chunk_distance
selector_training:
  selector_type: vlm
  vlm_model_path: "/root/autodl-fs/Qwen2.5-VL-3B-Instruct"
  # vlm_lora_path: null
  vlm_score_mode: "yes_no"
  vlm_rank_mode: "topk"
  vlm_k_select: 1         # null = 使用 bolt_config.k_select
  vlm_max_candidates: 999999  # 训练走 select_from_candidates 时通常等价于不截断；验证见 selector_inference
  vlm_prefilter_alpha: 0.6
  vlm_temperature: 0.7
  # vlm_power: null           # null = 使用 bolt_config.power
  # vlm_min_chunk_distance: null


# ── 训练参数 ──
training_config:
  # 约 7 chunk、亮-暗-亮三幕时第三幕多在 choice_idx>=4；随机 target 仅从此起抽（chunk 少则自动退回 2..）
  choice_idx_random_min: 4
  num_epochs: 50        # 20 条数据足够 150 epoch 收敛，300 太多容易过拟合
  bolt_lr: 2.5e-4       # Wq/Wk/Wv/out_proj 的 lr（保守，适合小数据）
  # LayerScale γ (per-channel gate) 单独学习率 (首选方案 A1)
  # γ ∈ R^{5120}, init=1e-4。目标区间 |γ| ∈ [1e-2, 1e-1]。
  # 参考 md/bolt_integration_plan_alpha.md §四
  lr_gamma: 1.0e-3
  grad_accum_steps: 1    # 20 条数据 batch=1 太碎，累积 4 步等效 batch=4 更稳定
  max_grad_norm: 1.0
  save_every: 5         # 更频繁保存，方便挑选最佳 checkpoint
  resume_from: null


# ── 验证 (Interactive 推理) ──
validation_config:
  validation_epochs: 5            # 每 N 个 epoch 执行一次验证推理
  validation_max_videos: 1      # CSV 中取前 N 个 video id（调大可完整跑 val 集）
  # 与训练对齐：selector_type=vlm 时验证默认走 LongMemory+codebook；可显式关闭：
  # enable_long_memory: false
  # 可选：GT latent .pt（含 vae_latent），用于 DINOv2「选中参考帧 middle vs 同 chunk GT middle」相似度
  validation_gt_pt: "/root/autodl-tmp/Selector_VLM/example_long/latents_short/sample_00001_0-241_241_384_640.pt"
  # 或在 CSV 中增加列 gt_latent_pt（每行或每 id 一条路径）
  validation_height: 384
  validation_width: 640
  validation_num_frames: 97       # 生成视频帧数
  validation_num_inference_steps: 50
  validation_guidance_scale: 5.0
  validation_latent_window_size: 9
  validation_fps: 24
  validation_seed: 42
  # Interactive prompt CSV (多段 prompt 的 interactive 推理)
  validation_interactive_csv: "/root/autodl-tmp/Helios/example/video_prompts_id12.csv"
  # 单段 prompt 备选 (如果不用 CSV)
  validation_prompts:
    - "An old man in blue jeans and a white T-shirt takes a leisurely stroll along a bustling street during a breathtaking sunset."
  # Pipeline 参数
  use_interpolate_prompt: true
  interpolation_steps: 1
  interpolate_time: 3
  # use_zero_init: true
  # use_cfg_zero_star: true
  # zero_steps: 1
  enable_low_vram_mode: true
  group_offloading_type: "leaf_level"

# 验证阶段与 infer_helios_bolt 对齐的 VLM / LongMemory（与训练 selector_training 可分开调）
selector_inference:
  vlm_max_candidates: 16
  lm_codebook_topm: 16
  lm_tau_cut: 0.25 
  lm_tau_merge: 0.85
  dino_model_path: "/root/autodl-fs/dinov2-base"   # ModelScope: facebook/dinov2-base；不填则走 HF facebook/dinov2-base
