# ═══════════════════════════════════════════════════════════════
# VLM Selector Training / Inference Config
# ═══════════════════════════════════════════════════════════════
# 本配置与 md/CLIP-base-selector-vlm.md §2.5 对齐，仅用于
#   · infer_helios_bolt.py --selector_type vlm 推理时的参数参考
#   · train_helios_selector_vlm.py 训练脚本的默认超参
# 注意：本 yaml 不会【替代】 CLIP+ITS 路径；仍然保留 --selector_type clip_its。
# ═══════════════════════════════════════════════════════════════


# ── 1. Selector 路由 ──
selector_type:        "vlm"             # clip_its | vlm | random
vlm_fallback_to_clip: true              # VLM 出错 → 回退 CLIP+ITS


# ── 2. VLM Backbone ──
vlm_model_path:       "/root/autodl-fs/Qwen2.5-VL-3B-Instruct"
vlm_lora_path:        null              # 训练产出的 LoRA adapter 路径（推理用）
vlm_image_resize:     [256, 448]        # 控制每张图 visual tokens 数
vlm_dtype:            "bfloat16"
vlm_score_mode:       "yes_no"          # yes_no | hidden_head（hidden_head=last visual token + Linear head）
vlm_offload_to_cpu:   true              # slow step 后立即 to('cpu')
vlm_temperature:      0.7
vlm_max_new_tokens:   32                # 仅 text-decode 路径使用（A 路径不调 generate）


# ── 3. Memory Bank（长视频推理 OOM 保护）──
mb_max_history_chunks: 32
mb_keep_recent_k:      8
mb_evict_strategy:     "farthest_lowclip"   # farthest_lowclip | oldest
mb_evict_alpha:        0.5


# ── 4. VLM Pre-filter（CLIP 粗筛）──
vlm_prefilter_enable:  true
vlm_prefilter_method:  "clip_topm"           # 目前只实现 clip_topm
vlm_max_candidates:    16                    # M：VLM 看几张候选


# ── 5. VLM Selection（VLM 精排 + ITS 输出端）──
vlm_k_select:          4                     # k：最终注入 DiT 的帧数
vlm_power:             2.0
vlm_min_chunk_distance: 3
vlm_prefilter_alpha:   0.6


# ── 6. Slow / Fast 调度 ──
vlm_slow_step_auto:    true                  # 按 interpolate_time_list 推断
vlm_slow_step_chunks:  null                  # 显式覆盖，如 "0,7,14"
vlm_cache_invalidate_on_evict: true
vlm_extra_slow_at_segment_mid: false


# ── 7. 训练参数（train_helios_selector_vlm.py 专用）──
training:
  data_jsonl:   /root/autodl-fs/selector_vlm_data/train.jsonl
  frames_dir:   /root/autodl-fs/selector_vlm_data/frames_mid

  kl_lambda:            1.0
  ce_lambda:            0.3
  temperature_teacher:  0.5

  lora_r:               16
  lora_alpha:           32
  lora_dropout:         0.05
  lora_target_modules:  ["q_proj", "k_proj", "v_proj", "o_proj"]

  vlm_lr:               2.0e-4
  head_lr:              5.0e-4          # 仅 score_mode=hidden_head 时生效

  batch_size:           4
  grad_accum_steps:     4
  num_epochs:           10
  warmup_steps:         200
  save_every:           1

  output_dir:           /root/autodl-fs/output/selector_vlm
